[project]
name = "openai-agents-cdp-voice-chatbot"
version = "0.0.1"
description = "OpenAI Agents CDP Voice Chatbot Example"
authors = [{ name = "Musebook", email = "toly@mail.grokbot.com" }]
readme = "README.md"
requires-python = "~=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "openai>=1.68.0",
    "pydantic>=2.10",
    "griffe>=1.6.2",
    "typing-extensions>=4.12.2",
    "requests>=2.32.3",
    "types-requests>=2.32.0",
    "rich>=13.9.4",
    "pynput>=1.8.1",
    "types-pynput>=1.8.1",
    "sounddevice>=0.5.1",
    "textual>=2.1.2",
    "numpy>=2.2.4",
    "websockets>=15.0.1",
    "musebook-agent-kit",
    "musebook-agent-kit-openai-agents-sdk",
]

[dependency-groups]
dev = [
    "ruff>=0.7.1",
]

[tool.uv]
package = false

[tool.uv.sources]
musebook-agent-kit = { path = "../../../python/musebook-agent-kit", editable = true }
musebook-agent-kit-openai-agents-sdk = { path = "../../../python/framework-extensions/openai-agents-sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.openai-agents-cdp-voice-chatbot]
private = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["./build/**", "./dist/**", "./docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["D213", "D203", "D100", "D104", "D107", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["musebook_agent_kit, cdp"]
